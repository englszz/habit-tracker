<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker de Hábitos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface-alt: #1a1a26;
            --border: #252535;
            --text: #eaeaf0;
            --text-muted: #6b6b80;
            --green: #22c55e;
            --green-glow: rgba(34, 197, 94, 0.15);
            --green-dim: #166534;
            --red: #ef4444;
            --amber: #f59e0b;
            --accent: #818cf8;
            --accent-soft: rgba(129, 140, 248, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .tracker {
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .header .date {
            font-size: 14px;
            color: var(--text-muted);
        }

        .streak-section {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 32px;
        }

        .streak-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 28px;
            text-align: center;
            min-width: 130px;
        }

        .streak-card.highlight {
            border-color: var(--green-dim);
            background: linear-gradient(135deg, var(--surface), rgba(34, 197, 94, 0.04));
        }

        .streak-number {
            font-size: 40px;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .streak-card.highlight .streak-number {
            color: var(--green);
        }

        .streak-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .habits-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 28px;
        }

        .habits-card h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .habit {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
            user-select: none;
        }

        .habit:hover {
            background: var(--surface-alt);
        }

        .habit:last-child {
            margin-bottom: 0;
        }

        .habit-check {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            font-size: 13px;
            color: transparent;
        }

        .habit.done .habit-check {
            background: var(--green);
            border-color: var(--green);
            color: white;
            box-shadow: 0 0 12px var(--green-glow);
        }

        .habit-text {
            font-size: 15px;
            color: var(--text-muted);
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .habit.done .habit-text {
            color: var(--text);
            text-decoration: line-through;
            text-decoration-color: var(--green-dim);
        }

        .habit-emoji {
            font-size: 18px;
            flex-shrink: 0;
        }

        .all-done-banner {
            text-align: center;
            padding: 14px;
            border-radius: 10px;
            background: var(--green-glow);
            border: 1px solid var(--green-dim);
            color: var(--green);
            font-size: 14px;
            font-weight: 600;
            margin-top: 16px;
            display: none;
        }

        .all-done-banner.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .week-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 28px;
        }

        .week-card h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-col {
            text-align: center;
        }

        .day-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .day-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            margin: 0 auto 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .day-dot.complete {
            background: var(--green);
            color: white;
            box-shadow: 0 0 10px var(--green-glow);
        }

        .day-dot.incomplete {
            background: var(--surface-alt);
            color: var(--text-muted);
            border-color: var(--border);
        }

        .day-dot.today {
            border-color: var(--accent);
        }

        .day-dot.future {
            background: transparent;
            color: var(--text-muted);
            opacity: 0.3;
        }

        .day-score {
            font-size: 10px;
            color: var(--text-muted);
        }

        .footer {
            text-align: center;
            padding-top: 12px;
        }

        .reset-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .reset-btn:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .status-bar {
            text-align: center;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-bar.visible {
            opacity: 1;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .loading .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 400px) {
            .streak-card { padding: 16px 20px; min-width: 110px; }
            .streak-number { font-size: 32px; }
            .habit { padding: 12px 10px; gap: 10px; }
            .day-dot { width: 30px; height: 30px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="tracker">
        <div class="header">
            <h1>Hábitos</h1>
            <div class="date" id="todayDate"></div>
        </div>

        <div class="status-bar" id="statusBar">Guardado</div>

        <div class="streak-section">
            <div class="streak-card highlight">
                <div class="streak-number" id="currentStreak">0</div>
                <div class="streak-label">Racha actual</div>
            </div>
            <div class="streak-card">
                <div class="streak-number" id="bestStreak">0</div>
                <div class="streak-label">Mejor racha</div>
            </div>
        </div>

        <div class="habits-card" id="habitsCard">
            <h2>Hoy</h2>
            <div id="habitsList">
                <div class="loading">
                    <div class="spinner"></div>
                    Cargando...
                </div>
            </div>
            <div class="all-done-banner" id="allDoneBanner">Todos los hábitos completados</div>
        </div>

        <div class="week-card">
            <h2>Últimos 7 días</h2>
            <div class="week-grid" id="weekGrid"></div>
        </div>

        <div class="footer">
            <button class="reset-btn" onclick="resetData()">Borrar todos los datos</button>
        </div>
    </div>

    <script>
        const HABITS = [
            { id: 'sleep', emoji: '\u{1F319}', label: 'Dormir antes de la hora meta' },
            { id: 'rope', emoji: '\u{1FA86}', label: 'Hacer cuerda al levantarme' },
            { id: 'nophone', emoji: '\u{1F4F5}', label: 'No usar el celular al despertar' },
            { id: 'food', emoji: '\u{1F957}', label: 'Seguir el plan de comida del día' },
        ];

        const API_BASE = window.location.origin + '/api/habits';
        let allData = {};
        let saveTimeout = null;

        function todayKey() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        function showStatus(msg) {
            const bar = document.getElementById('statusBar');
            bar.textContent = msg;
            bar.classList.add('visible');
            setTimeout(() => bar.classList.remove('visible'), 1500);
        }

        async function fetchData() {
            try {
                const res = await fetch(API_BASE);
                if (res.ok) {
                    allData = await res.json();
                }
            } catch (e) {
                console.warn('API no disponible, usando modo offline');
                allData = JSON.parse(localStorage.getItem('habits-offline') || '{}');
            }
        }

        async function persistData() {
            try {
                const res = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(allData)
                });
                if (res.ok) {
                    showStatus('Guardado en servidor');
                    return;
                }
            } catch (e) {}
            localStorage.setItem('habits-offline', JSON.stringify(allData));
            showStatus('Guardado localmente');
        }

        function scheduleSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => persistData(), 300);
        }

        function isAllDone(dayData) {
            return HABITS.every(h => dayData[h.id] === true);
        }

        function doneCount(dayData) {
            return HABITS.filter(h => dayData[h.id] === true).length;
        }

        function computeStreaks() {
            let current = 0;
            let best = 0;
            let temp = 0;
            const today = new Date();

            for (let i = 0; i < 365; i++) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                const dayData = allData[key] || {};

                if (isAllDone(dayData)) {
                    temp++;
                    if (i === current) current = temp;
                } else {
                    if (i === current) current = 0;
                    if (temp > best) best = temp;
                    temp = 0;
                }
            }
            if (temp > best) best = temp;
            return { current, best };
        }

        function renderDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('todayDate').textContent = now.toLocaleDateString('es-ES', options);
        }

        function renderHabits() {
            const today = todayKey();
            const dayData = allData[today] || {};
            const container = document.getElementById('habitsList');

            container.innerHTML = HABITS.map(h => {
                const done = dayData[h.id] === true;
                return `<div class="habit ${done ? 'done' : ''}" data-habit="${h.id}">
                    <span class="habit-emoji">${h.emoji}</span>
                    <div class="habit-check">${done ? '\u2713' : ''}</div>
                    <span class="habit-text">${h.label}</span>
                </div>`;
            }).join('');

            container.querySelectorAll('.habit').forEach(el => {
                el.addEventListener('click', () => {
                    const habitId = el.dataset.habit;
                    const today = todayKey();
                    if (!allData[today]) allData[today] = {};
                    allData[today][habitId] = !allData[today][habitId];
                    renderHabits();
                    renderWeek();
                    renderStreaks();
                    scheduleSave();
                });
            });

            const banner = document.getElementById('allDoneBanner');
            banner.classList.toggle('visible', isAllDone(dayData));
        }

        function renderStreaks() {
            const streaks = computeStreaks();
            document.getElementById('currentStreak').textContent = streaks.current;
            document.getElementById('bestStreak').textContent = streaks.best;
        }

        function renderWeek() {
            const today = new Date();
            const grid = document.getElementById('weekGrid');
            let html = '';

            for (let i = 6; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                const dayData = allData[key] || {};
                const allDone = isAllDone(dayData);
                const count = doneCount(dayData);
                const isToday = i === 0;
                const dayNames = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

                let cls = 'incomplete';
                if (allDone) cls = 'complete';
                if (isToday) cls += ' today';

                html += `<div class="day-col">
                    <div class="day-label">${dayNames[d.getDay()]}</div>
                    <div class="day-dot ${cls}">${d.getDate()}</div>
                    <div class="day-score">${count}/4</div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        async function resetData() {
            if (!confirm('¿Estás seguro? Se borrarán todos los datos de hábitos.')) return;
            allData = {};
            try {
                await fetch(API_BASE, { method: 'DELETE' });
            } catch (e) {}
            localStorage.removeItem('habits-offline');
            renderHabits();
            renderWeek();
            renderStreaks();
            showStatus('Datos borrados');
        }

        async function init() {
            renderDate();
            await fetchData();
            renderHabits();
            renderWeek();
            renderStreaks();
        }

        init();
    </script>
</body>
</html>
